spring.application.name=portal_be

spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=portal

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
server.tomcat.max-part-count=30

spring.main.allow-circular-references=true

server.address=0.0.0.0
server.port=8083

server.ssl.enabled=false
# server.ssl.key-store=file:D:/Project internal/chung chi/homepage.p12
# server.ssl.key-store-password=123456
# server.ssl.key-store-type=PKCS12
# server.ssl.key-alias=homepage

server.forward-headers-strategy=framework
# ==================== ACTIVE DIRECTORY / DOMAIN LOGIN ====================
# Active Directory validates the Windows/Domain credentials and supplies email.
# Portal role and permissions continue to come from the existing MongoDB user.
app.ldap.enabled=${LDAP_ENABLED:true}
app.ldap.urls=${LDAP_URLS:ldaps://VN-DC2.youngonevn.com:636}
app.ldap.base-dn=${LDAP_BASE_DN:DC=youngonevn,DC=com}
app.ldap.domain=${LDAP_DOMAIN:youngonevn.com}
app.ldap.netbios-domain=${LDAP_NETBIOS_DOMAIN:YOUNGONEVN}

# Match the working AD login path: username/password -> Kerberos -> LDAP SASL GSSAPI.
app.ldap.authentication-mode=${LDAP_AUTHENTICATION_MODE:KERBEROS_GSSAPI}
app.kerberos.realm=${KERBEROS_REALM:YOUNGONEVN.COM}
app.kerberos.kdc=${KERBEROS_KDC:VN-DC2.youngonevn.com}
app.kerberos.ldap-qop=${KERBEROS_LDAP_QOP:auth}
app.kerberos.debug=${KERBEROS_DEBUG:false}

# Retained only as an explicit fallback when LDAP_AUTHENTICATION_MODE=SIMPLE.
app.ldap.bare-username-bind-format=${LDAP_BARE_USERNAME_BIND_FORMAT:NETBIOS}
app.ldap.connect-timeout-ms=${LDAP_CONNECT_TIMEOUT_MS:5000}
app.ldap.read-timeout-ms=${LDAP_READ_TIMEOUT_MS:7000}

# LDAPS trust for local Windows/Gradle execution. This is independent of HTTP ports.
app.ldap.trust.enabled=${LDAP_TRUST_ENABLED:true}
app.ldap.trust.use-jvm-default=${LDAP_TRUST_USE_JVM_DEFAULT:true}
app.ldap.trust.use-windows-root=${LDAP_TRUST_USE_WINDOWS_ROOT:true}
app.ldap.trust.certificate-locations=${LDAP_TRUST_CERTIFICATE_LOCATIONS:}
